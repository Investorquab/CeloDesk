name: Deploy CeloDesk Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: celodesk-backend-production
  cancel-in-progress: false

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify VPS SSH access
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'echo "SSH connection OK"'

      - name: Upload backend source
        run: |
          rsync -az --exclude='.env' --exclude='node_modules' --exclude='dist' \
            backend/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/celodesk/backend/"

      - name: Build and restart production API
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -e
          cd /root/celodesk/backend
          npm ci
          npm run build
          pm2 restart celodesk-api --update-env
          sleep 3
          curl --fail --silent --show-error https://api.185-7-81-139.sslip.io/health
          echo
          echo "CeloDesk backend deployment successful."
          REMOTE
