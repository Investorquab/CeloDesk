name: Fix AssistantBox

on:
  push:
    paths:
      - 'automation/fix-assistant.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical AssistantBox fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/components/AssistantBox.tsx')
          s = p.read_text()

          s = s.replace('history.slice(-10)', 'history.slice(-6)')
          s = s.replace(".slice(-12));", ".slice(-6));")
          s = s.replace(
              "const lastMessage = messages[messages.length - 1];\n  const askingForToken = !created && !busy && lastMessage?.role === 'assistant' && /which (payment )?token|payment token/i.test(lastMessage.text);",
              "const lastMessage = messages[messages.length - 1];\n  const lastUserMessage = [...messages].reverse().find((message) => message.role === 'user');\n  const askingForToken = !created && !busy && lastMessage?.role === 'assistant' && lastUserMessage?.role === 'user' && /\\b(?:\\$|usd|dollars?|million dollars?|thousand dollars?)\\b/i.test(lastUserMessage.text) && /which (payment )?token|what (payment )?token|choose (a )?(payment )?token/i.test(lastMessage.text);"
          )
          s = s.replace(
              '<button className="assistantCreatedButton" onClick={copyInvoiceLink}><Copy size={13} />{copyState || \'Copy link\'}</button>',
              '<button className="assistantCreatedButton copyButton" onClick={copyInvoiceLink}><Copy size={13} />{copyState || \'Copy link\'}</button>'
          )
          s = s.replace(
              '.assistantCreatedActions{display:flex;gap:7px;flex-wrap:wrap}',
              '.assistantCreatedActions{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:7px}'
          )
          s = s.replace(
              '.assistantCreatedButton{border:1px solid',
              '.assistantCreatedButton{min-width:0;border:1px solid'
          )
          s = s.replace(
              'font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}',
              'font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;text-decoration:none;white-space:nowrap}.assistantCreatedButton.copyButton{grid-column:1/-1}'
          )
          s = s.replace(
              '@media(max-width:560px){.assistantConversation{max-height:330px;gap:12px}.assistantMessage{max-width:91%}.assistantMessageBubble{font-size:11px;padding:9px 11px}.assistantTokenPicker{grid-template-columns:repeat(2,1fr)}.assistantCreatedInConversation{padding:12px}.assistantCreatedBody b{font-size:19px}.assistantCreatedActions{display:grid;grid-template-columns:1fr 1fr}.assistantCreatedButton{min-height:34px}.assistantCreatedButton.primary{grid-column:1/-1}.assistantInput input{font-size:16px!important;line-height:1.2}.assistantInput{position:relative}}',
              '@media(max-width:560px){.assistantConversation{max-height:330px;gap:12px}.assistantMessage{max-width:91%}.assistantMessageBubble{font-size:11px;padding:9px 11px}.assistantTokenPicker{grid-template-columns:repeat(2,1fr)}.assistantCreatedInConversation{padding:12px}.assistantCreatedBody b{font-size:19px}.assistantCreatedActions{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.assistantCreatedButton{min-height:34px}.assistantInput input{font-size:16px!important;line-height:1.2}.assistantInput{position:relative}}'
          )
          p.write_text(s)
          PY

      - name: Verify source patch
        run: |
          grep -n "history.slice(-6)" frontend/components/AssistantBox.tsx
          grep -n "lastUserMessage" frontend/components/AssistantBox.tsx
          grep -n "copyButton" frontend/components/AssistantBox.tsx

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/AssistantBox.tsx
          git rm -f automation/fix-assistant.trigger .github/workflows/fix-assistant.yml
          git commit -m "Fix CeloDesk assistant conversation flow"
          git push origin main
